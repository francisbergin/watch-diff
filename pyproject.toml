[project]
name = "watch-diff"
version = "1.3.0"
description = "Watch command output and get notified on changes"
readme = "README.md"
authors = [
    {name = "Francis Bergin", email = "contact@francisbergin.net"},
]
maintainers = [
    {name = "Francis Bergin", email = "contact@francisbergin.net"},
]
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/francisbergin/watch-diff"

[project.scripts]
watch-diff = "watch_diff.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 120
target-version = "py314"
